class Campus extends Phaser.Scene{constructor(){super('campus')}create(){this.mode='outside';this.room=0;this.held={up:false,down:false,left:false,right:false};this.dialogOpen=false;this.progress=this.readSave();this.keys=this.input.keyboard.addKeys('UP,DOWN,LEFT,RIGHT,SPACE,ENTER,ESC');this.buildWorld();this.createPlayer();this.createUI();this.input.keyboard.on('keydown-SPACE',()=>this.interact());this.input.keyboard.on('keydown-ENTER',()=>this.dialogOpen?this.nextDialog():this.interact());this.input.keyboard.on('keydown-ESC',()=>this.dialogOpen?this.closeDialog():this.mode!=='outside'&&this.mode==='room'?this.goHall():this.mode==='hall'?this.goOutside():null);this.refresh();this.updateQuest()}
readSave(){try{return Object.assign({talked:false,directions:false,visitedOffice:false},JSON.parse(localStorage.getItem('isitcomCampusSave')||'{}'))}catch(e){return{talked:false,directions:false,visitedOffice:false}}}save(){try{localStorage.setItem('isitcomCampusSave',JSON.stringify(this.progress))}catch(e){}}txt(parent,x,y,s,size=8,color='#f6e8c6',originX=0,originY=0,wrap){let t=this.add.text(x,y,s,{fontFamily:'"Press Start 2P",monospace',fontSize:size+'px',color,lineSpacing:7,wordWrap:wrap?{width:wrap}:undefined}).setOrigin(originX,originY).setResolution(2);parent.add(t);return t}

this.rooms=[];const titles=['SCOLARITÉ','ADMINISTRATION','BUREAU DES ENSEIGNANTS'];const desc=[['STUDENT SERVICES','Bring your student card and','check your registration details.'],['ADMINISTRATION','Ask about official documents,','certificates and procedures.'],['TEACHING STAFF','Ask about courses,','CM, TD and TP sessions.']];for(let id=0;id<3;id++){let c=this.add.container(0,0);this.out.add(c);this.rooms.push(c);let r=this.add.graphics();c.add(r);r.fillStyle(0x35464c,1).fillRect(0,0,W,H);r.fillStyle(0xd4c9ae,1).fillRect(20,20,W-40,H-40);r.fillStyle(0xb9a98b,1).fillRect(20,20,W-40,78);r.fillStyle(0x3d6570,1).fillRect(20,20,W-40,14);for(let y=100;y<H-20;y+=32)for(let x=20;x<W-20;x+=32){r.fillStyle(((x+y)/32)%2===0?0xe8dfc7:0xdcd0b5,1).fillRect(x,y,31,31)}r.fillStyle(0x72583e,1).fillRect(110,130,740,24);r.fillStyle(0x9b774d,1).fillRect(116,134,728,14);this.txt(c,480,151,titles[id],10,'#29424e',.5);r.fillStyle(0x684b36,1).fillRect(270,250,420,100);r.fillStyle(0xb98b59,1).fillRect(280,258,400,78);r.fillStyle(0x87613e,1).fillRect(280,329,400,16);r.fillStyle(0x557b81,1).fillRect(390,216,180,34);r.fillStyle(0xb8d6d1,1).fillRect(398,222,164,22);this.txt(c,480,229,'SERVICE DESK',6,'#29424e',.5);[90,130,170].forEach(x=>{r.fillStyle(0x5d7580,1).fillRect(x,220,28,100);r.fillStyle(0x8fa9a8,1).fillRect(x+4,226,20,26).fillRect(x+4,261,20,26)});r.fillStyle(0x46774e,1).fillRect(790,260,35,48);r.fillStyle(0x6e9c58,1).fillRect(782,246,50,25);this.txt(c,480,410,desc[id][0],7,'#29424e',.5);this.txt(c,480,434,desc[id][1],6,'#52635c',.5);this.txt(c,480,451,desc[id][2],6,'#52635c',.5);this.txt(c,480,490,'PRESS ESC TO RETURN TO HALLWAY',6,'#52635c',.5)}}
createPlayer(){this.player=this.add.container(480,405);this.out.add(this.player);let g=this.add.graphics();this.player.add(g);g.fillStyle(0x283d48,1).fillRect(-8,12,7,9).fillRect(2,12,7,9);g.fillStyle(0x24323a,1).fillRect(-9,19,8,4).fillRect(2,19,8,4);g.fillStyle(0x527f9b,1).fillRect(-10,0,20,14);g.fillStyle(0x3c657e,1).fillRect(-10,9,20,5);g.fillStyle(C.skin,1).fillRect(-7,-11,14,12);g.fillStyle(0x46362e,1).fillRect(-8,-13,16,5).fillRect(-8,-9,3,4).fillRect(5,-9,3,4);g.fillStyle(0x24343d,1).fillRect(-4,-6,2,2).fillRect(3,-6,2,2);g.fillStyle(C.gold,1).fillRect(-3,3,6,3);this.player.setDepth(405);this.speed=145;this.npcs=[];this.makeNPC(320,405,0x896b9f,'studentOutside');this.makeNPC(645,405,0x527f9b,'studentOutside2');this.makeNPC(320,245,0x896b9f,'studentHall');this.makeNPC(480,300,0x527f9b,'officeStaff')}
makeNPC(x,y,shirt,tag){let c=this.add.container(x,y);let g=this.add.graphics();c.add(g);g.fillStyle(0x283d48,1).fillRect(-7,10,6,8).fillRect(2,10,6,8);g.fillStyle(0x26343a,1).fillRect(-8,17,7,4).fillRect(2,17,7,4);g.fillStyle(shirt,1).fillRect(-9,-1,18,13);g.fillStyle(C.skin,1).fillRect(-6,-11,12,11);g.fillStyle(0x47372e,1).fillRect(-7,-13,14,5);g.fillStyle(0x24343d,1).fillRect(-3,-6,2,2).fillRect(3,-6,2,2);c.setDepth(y);c.tag=tag;this.out.add(c);this.npcs.push(c);return c}
createUI(){this.prompt=this.add.container(W/2,H-65).setDepth(1000);let bg=this.add.graphics();bg.fillStyle(0x172b35,.96).fillRoundedRect(-245,-26,490,48,5);bg.lineStyle(2,0xe8bd69,1).strokeRoundedRect(-245,-26,490,48,5);this.prompt.add(bg);this.promptText=this.txt(this.prompt,0,-2,'',7,'#f6e8c6',.5,.5);this.prompt.setVisible(false);this.dialog=this.add.container(W/2,H-105).setDepth(2000);let dg=this.add.graphics();dg.fillStyle(0x142630,.98).fillRoundedRect(-440,-65,880,128,6);dg.lineStyle(3,0xe8bd69,1).strokeRoundedRect(-440,-65,880,128,6);this.dialog.add(dg);this.dName=this.txt(this.dialog,-414,-46,'',8,'#f1c86e');this.dBody=this.txt(this.dialog,-414,-22,'',7,'#f6e8c6',0,0,800);this.dHint=this.txt(this.dialog,410,43,'ENTER / SPACE  ▼',6,'#b8d6d1',1);this.dialog.setVisible(false);this.toast=this.txt(this, W/2,18,'',7,'#f6e8c6',.5);this.toast.setDepth(1500);this.toast.setVisible(false);this.status=this.txt(this,12,12,'',6,'#29424e');this.status.setDepth(100);this.prompt.setScrollFactor(0);this.dialog.setScrollFactor(0);this.toast.setScrollFactor(0);this.status.setScrollFactor(0)}
refresh(){this.out.setVisible(true);this.hall.setVisible(this.mode==='hall');this.rooms.forEach((r,i)=>r.setVisible(this.mode==='room'&&i===this.room));this.npcs.forEach(n=>n.setVisible((this.mode==='outside'&&n.tag.startsWith('studentOutside'))||(this.mode==='hall'&&n.tag==='studentHall')||(this.mode==='room'&&n.tag==='officeStaff'&&this.room===0)));this.player.setPosition(480,this.mode==='outside'?405:this.mode==='hall'?430:380);this.player.setVisible(true);this.updateQuest()}
updateQuest(){let el=document.getElementById('quest-label');el.textContent=!this.progress.talked?'Talk to a student':!this.progress.directions?'Find the Scolarité office':!this.progress.visitedOffice?'Visit the Scolarité office':'Campus orientation complete!'}showToast(s){this.toast.setText(s).setVisible(true);this.time.delayedCall(2200,()=>this.toast&&this.toast.setVisible(false))}openDialog(name,lines,cb){this.dialogOpen=true;this.lines=Array.isArray(lines)?lines:[lines];this.line=0;this.cb=cb||null;this.dName.setText(name);this.dBody.setText(this.lines[0]);this.dialog.setVisible(true);this.prompt.setVisible(false)}nextDialog(){if(!this.dialogOpen)return;if(++this.line>=this.lines.length){let cb=this.cb;this.closeDialog();if(cb)cb();return}this.dBody.setText(this.lines[this.line])}closeDialog(){this.dialogOpen=false;this.dialog.setVisible(false);this.cb=null}
findTarget(){let x=this.player.x,y=this.player.y,near=(a,b,r=58)=>Math.hypot(x-a,y-b)<r;if(this.mode==='outside'){if(near(480,320,72))return{type:'entrance'};if(near(320,405,60))return{type:'student'};if(near(645,405,60))return{type:'student'}}if(this.mode==='hall'){if(near(480,470,58))return{type:'exit'};if(near(180,160,64))return{type:'door',id:0};if(near(450,160,64))return{type:'door',id:1};if(near(720,160,64))return{type:'door',id:2};if(near(320,245,55))return{type:'studentHall'}}if(this.mode==='room'&&near(480,300,75))return{type:'officeStaff'};return null}
interact(){if(this.dialogOpen){this.nextDialog();return}let t=this.findTarget();if(!t){this.showToast('NO ONE NEARBY — WALK CLOSER');return}if(t.type==='entrance'){this.mode='hall';this.refresh();this.showToast('ADMINISTRATIVE HALLWAY');return}if(t.type==='exit'){this.goOutside();return}if(t.type==='door'){if(t.id!==0&&!this.progress.visitedOffice){this.openDialog('LOCKED DOOR',['This office is locked for now.','First visit the Scolarité office and ask about student procedures.']);return}this.mode='room';this.room=t.id;this.refresh();this.showToast(['SCOLARITÉ OFFICE','ADMINISTRATION','TEACHING STAFF'][t.id]);return}if(t.type==='student'||t.type==='studentHall'){this.openDialog('STUDENT',['Hi! Welcome to ISITCOM. Need help finding your way?','The Scolarité office is the first door in the administrative hallway. It handles student records and certificates.','CM is a lecture, TD is a tutorial, and TP is practical work.'],()=>{this.progress.talked=true;this.progress.directions=true;this.save();this.updateQuest();this.showToast('MISSION UPDATED: FIND SCOLARITÉ')});return}if(t.type==='officeStaff'){this.openDialog('SCOLARITÉ STAFF',['Welcome. This is the Scolarité service.','Bring your student card when asking about registration, certificates or your student file.','Orientation mission complete. The other administrative rooms are now unlocked.'],()=>{this.progress.visitedOffice=true;this.save();this.updateQuest();this.showToast('ALL ADMINISTRATIVE ROOMS UNLOCKED')})}}

update(time,delta){if(!this.player||this.dialogOpen)return;let dx=0,dy=0,k=this.keys;if(k.LEFT.isDown||this.held.left)dx=-1;else if(k.RIGHT.isDown||this.held.right)dx=1;if(k.UP.isDown||this.held.up)dy=-1;else if(k.DOWN.isDown||this.held.down)dy=1;if(dx&&dy){dx*=.7071;dy*=.7071}let step=this.speed*delta/1000,nx=Phaser.Math.Clamp(this.player.x+dx*step,32,W-32),ny=Phaser.Math.Clamp(this.player.y+dy*step,125,H-35);if(this.mode==='outside'){if(ny<365&&(nx<390||nx>570))ny=365;if(ny<300&&nx>190&&nx<770)ny=300;this.player.x=nx;this.player.y=ny}else if(this.mode==='hall'){this.player.x=Phaser.Math.Clamp(nx,45,W-45);this.player.y=Phaser.Math.Clamp(ny,150,H-42)}else{this.player.x=Phaser.Math.Clamp(nx,45,W-45);this.player.y=Phaser.Math.Clamp(ny,145,H-42)}this.player.setDepth(this.player.y);this.npcs.forEach(n=>n.setDepth(n.y));let t=this.findTarget();if(t){this.promptText.setText(t.type==='entrance'?'ENTER ISITCOM':t.type==='exit'?'EXIT TO CAMPUS':t.type==='door'?'OPEN '+['SCOLARITÉ','ADMINISTRATION','ENSEIGNANTS'][t.id]:'PRESS ENTER TO TALK');this.prompt.setVisible(true)}else this.prompt.setVisible(false);this.status.setText(this.mode==='outside'?'AREA: CAMPUS':this.mode==='hall'?'AREA: ADMINISTRATIVE HALLWAY':'AREA: '+['SCOLARITÉ','ADMINISTRATION','ENSEIGNANTS'][this.room])}}
game=new Phaser.Game({type:Phaser.CANVAS,parent:'game',width:W,height:H,backgroundColor:'#263d44',pixelArt:true,antialias:false,roundPixels:true,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},scene:[Campus]});const scene=()=>game.scene.getScene('campus');function bind(id,dir){let el=document.getElementById(id);const down=e=>{e.preventDefault();el.classList.add('down');let s=scene();if(s.held)s.held[dir]=true};const up=e=>{e.preventDefault();el.classList.remove('down');let s=scene();if(s.held)s.held[dir]=false};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,up))}bind('up','up');bind('down','down');bind('left','left');bind('right','right');document.getElementById('action').addEventListener('pointerdown',e=>{e.preventDefault();if(game.scene.isActive('campus'))scene().interact()});})();
